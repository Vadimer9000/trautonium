name: Build Android APK (Trautonium)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Android Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trautonium-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8990501655:AAG8Txwy1QK7UX14DJHfKf6ssk-oJnPrvHI' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '393569601' }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
            CAPTION="⚡ *Готова новая сборка APK Траутониум!*%0A%0A💬 _${COMMIT_MSG}_%0A⏰ $(date +'%d.%m.%Y %H:%M:%S UTC')"
            curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                 -F document=@"${{ steps.locate_apk.outputs.apk_path }}" \
                 -F caption="${CAPTION}" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          fi
